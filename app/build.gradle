plugins { id 'com.android.application' }
android {
    namespace 'com.zaka.moviebox'
    compileSdk 34
    defaultConfig {
        applicationId "com.zaka.moviebox"
        minSdk 23
        targetSdk 34
        versionCode 4
        versionName "1.3-phase3"
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { viewBinding false }
    lint { abortOnError false; checkReleaseBuilds false }
    testOptions { unitTests.includeAndroidResources = true }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.3.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    testImplementation 'androidx.test:core:1.5.0'
}

tasks.withType(Test).configureEach {
    systemProperty 'http.proxyHost', '127.0.0.1'
    systemProperty 'http.proxyPort', '19995'
    systemProperty 'https.proxyHost', '127.0.0.1'
    systemProperty 'https.proxyPort', '19995'
}
